name: Sync Canonical Glass Master

# KLA-311 F1B — importerer systemnøytralt canonical master-snapshot
# (fra FinnBilGlass staging) inn i Autoglassgrossisten B2B glass-catalog-db.
#
# Snapshotet (data/canonical-master/*.gz + manifest.json) er versjonert i repoet.
# Importen er idempotent (INSERT OR IGNORE) og verifiserer radtall + source_id
# mot manifestet — slik at begge resolverne deler samme source_id + fingerprint.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"  # Søndag kl 06:00 CET — ukentlig re-sync (idempotent)

env:
  NODE_VERSION: "22"

jobs:
  sync-canonical-master:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer wrangler
        run: npm install -g wrangler

      - name: Valider manifest
        run: |
          set -euo pipefail
          cd data/canonical-master
          test -f manifest.json || { echo "❌ manifest.json mangler"; exit 1; }
          test -f canonical-master.sql.gz || { echo "❌ canonical-master.sql.gz mangler"; exit 1; }
          python3 -c "import json; m=json.load(open('manifest.json')); print('fingerprint:', m['raw_fingerprint']); print('counts:', m['counts'])"

      - name: Migrasjon 0025 — opprett canonical-tabeller
        working-directory: api/cf-worker
        run: wrangler d1 execute glass-catalog-db --remote --file migrations/0025_canonical_glass_master.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Importer snapshot (FK-rekkefølge, idempotent)
        working-directory: data/canonical-master
        run: |
          set -euo pipefail
          for f in source_katalog glass_master glass_identifiers glass_features glass_vehicle_links; do
            echo "=== importerer ${f} ==="
            gunzip -c "${f}.sql.gz" > "/tmp/${f}.sql"
            wrangler d1 execute glass-catalog-db --remote --file "/tmp/${f}.sql"
            rm -f "/tmp/${f}.sql"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verifiser radtall + source_id mot manifest
        working-directory: data/canonical-master
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, os, sys
          m = json.load(open('manifest.json'))
          expected = m['counts']
          expected_sources = set(m['source_ids'])

          def d1(sql):
              out = subprocess.run(
                  ['wrangler','d1','execute','glass-catalog-db','--remote','--json','--command',sql],
                  capture_output=True, text=True, env=os.environ)
              if out.returncode != 0:
                  print('❌ wrangler feilet:', out.stderr[-500:]); sys.exit(1)
              import json as j
              return j.loads(out.stdout)[0]['results']

          ok = True
          for table, n in expected.items():
              got = d1(f"SELECT COUNT(*) AS n FROM {table}")[0]['n']
              status = '✅' if got == n else '❌'
              if got != n: ok = False
              print(f"{status} {table}: {got} (forventet {n})")

          got_sources = set(r['source_id'] for r in d1("SELECT DISTINCT source_id FROM source_katalog"))
          missing = expected_sources - got_sources
          print(f"{'✅' if not missing else '❌'} source_id: {sorted(got_sources)}")
          if missing: print(f"   mangler: {missing}"); ok = False

          # Sample-eurocode-verifisering (kandidatsett-konsistens, KLA-311 #2)
          sample = d1("SELECT eurocode FROM glass_master WHERE is_current=1 AND eurocode IS NOT NULL LIMIT 1")[0]['eurocode']
          print(f"   sample-eurocode: {sample}")
          print('✅' if sample else '❌', 'glass_master har minst én aktiv eurocode')

          if not ok:
              print('❌ Verifisering FEILET — radtall/source_id avviker fra manifest'); sys.exit(1)
          print('✅ Canonical master synkronisert — radtall + source_id matcher manifest')
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

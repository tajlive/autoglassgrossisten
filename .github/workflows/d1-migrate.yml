name: D1 Migrate & Enrich

on:
  workflow_dispatch:

jobs:
  migrate-and-enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler

      - name: D1 Migration 0008 — ADAS calibration requirements
        working-directory: api/cf-worker
        run: |
          wrangler d1 execute glass-catalog-db --remote --file migrations/0008_adas_calibration_requirements.sql
          wrangler d1 execute glass-catalog-db --remote --file generated-csc-inserts.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: D1 Migration 0009 — ktype_registry
        working-directory: api/cf-worker
        run: |
          wrangler d1 execute glass-catalog-db --remote --file migrations/0009_ktype_registry.sql
          wrangler d1 execute glass-catalog-db --remote --file generated-ktype-inserts.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: D1 Migration 0026 — ECE R43-verifiseringskanal
        working-directory: api/cf-worker
        run: |
          wrangler d1 execute glass-catalog-db --remote --file migrations/0026_ece_r43.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Seed ECE R43-testdata (idempotent)
        working-directory: api/cf-worker
        run: |
          wrangler d1 execute glass-catalog-db --remote --command "INSERT OR IGNORE INTO ece_r43 (r43_nummer, landkode, eurokode, varenr, kategori, merke, modell, kilde, bekreftet) VALUES ('004592', 'E1', '8579AGSGYAVZ1B', '8579AGSGYAVZ1B', 'frontrute', 'VW', 'TRANSPORTER T5 2003-', 'manual', 1)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify
        working-directory: api/cf-worker
        run: |
          echo "=== ADAS calibration requirements ==="
          wrangler d1 execute glass-catalog-db --remote --command "SELECT COUNT(*) as csc_count FROM adas_calibration_requirements"
          echo "=== By sensor type ==="
          wrangler d1 execute glass-catalog-db --remote --command "SELECT sensor_type, COUNT(*) as c FROM adas_calibration_requirements GROUP BY sensor_type"
          echo "=== ktype_registry ==="
          wrangler d1 execute glass-catalog-db --remote --command "SELECT COUNT(*) as ktype_count FROM ktype_registry"
          wrangler d1 execute glass-catalog-db --remote --command "SELECT brand, COUNT(*) as c FROM ktype_registry GROUP BY brand"
          echo "=== ece_r43 ==="
          wrangler d1 execute glass-catalog-db --remote --command "SELECT COUNT(*) as r43_count FROM ece_r43"
          wrangler d1 execute glass-catalog-db --remote --command "SELECT r43_nummer, eurokode, kategori, bekreftet FROM ece_r43 LIMIT 10"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

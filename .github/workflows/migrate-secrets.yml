name: Migrer secrets til tajlive

on:
  push:
    branches: [migrate-secrets]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Kopier secrets til tajlive/autoglassgrossisten
        env:
          GH_MIGRATE_TOKEN: ${{ secrets.GH_MIGRATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SVV_API_KEY: ${{ secrets.SVV_API_KEY }}
          BILUPPGIFTER_API_KEY: ${{ secrets.BILUPPGIFTER_API_KEY }}
          BOVSOFT_CLIENT_ID: ${{ secrets.BOVSOFT_CLIENT_ID }}
          BOVSOFT_SECCODE: ${{ secrets.BOVSOFT_SECCODE }}
          GLASS_KV_NAMESPACE_ID: ${{ secrets.GLASS_KV_NAMESPACE_ID }}
        run: |
          export GH_TOKEN="$GH_MIGRATE_TOKEN"
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SVV_API_KEY BILUPPGIFTER_API_KEY BOVSOFT_CLIENT_ID BOVSOFT_SECCODE GLASS_KV_NAMESPACE_ID; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "⚠️  $name er tom — hopper over"
              continue
            fi
            gh secret set "$name" --repo tajlive/autoglassgrossisten --body "$val"
            echo "✅ $name migrert"
          done
